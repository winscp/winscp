EDITOR_EARLY_CLOSED2="Редакторът (приложението), стартиран за отваряне на файл „%s“, се затвори твърде рано. Ако не е затворен от вас, това може да се е случило, защото вашият външен редактор отваря множество файлове в един прозорец (процес). В такива случаи допълнително стартираните инстанции на редактора просто изпращат новия файл към вече съществуващата инстанция и се затварят веднага. За да поддържа този тип редактори, WinSCP трябва да адаптира поведението си – да не изтрива временния файл при приключване на процеса, а да го пази, докато WinSCP работи. Това поведение може да бъде включено, като изключите опцията в настройките на редактора „Външният редактор отваря всеки файл в отделен прозорец (процес)“. Ако вашият редактор не е от този тип, пренебрегнете това съобщение и разрешете файлът да бъде премахнат от временната папка сега.\n \nИскате ли да премахнете отворения файл сега? (С натискане на „Не“ ще активирате специалното поведение и ще запазите файла във временната папка.)"
SAVE_SYNCHRONIZE_MODE2="**Искате ли да направите избраната от вас посока посока по подразбиране?**\n\nВие променихте предварително зададената посока на синхронизация. По подразбиране посоката се определя от файловия панел, който е бил активен, преди да стартирате функцията за синхронизиране."
