INTERNAL_EDITOR_LARGE_FILE2="**Опит за отваряне на голям файл?**\n\nФайлът, който се опитвате да отворите във вътрешния редактор, е твърде голям (%s). Вътрешният редактор на WinSCP не е предназначен за редактиране на големи файлове. Обмислете използването на външен редактор, който поддържа големи файлове.\n\nМожете да опитате да отворите файла въпреки това, но WinSCP може да блокира."
