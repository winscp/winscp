[Propagation.rc]
DESCRIPTION_45_LETTERS2="Безплатен SFTP, SCP, S3 и FTP клиент за Windows"
DESCRIPTION_80_LETTERS3="WinSCP е безплатен файлов мениджър за Windows с поддръжка на FTP, SFTP, S3 и WebDAV."
DESCRIPTION_250_LETTERS4="WinSCP е популярен безплатен файлов мениджър за Windows, поддържащ SFTP, FTP, FTPS, SCP, S3, WebDAV и локални трансфери. Мощен инструмент за повишаване на производителността с удобен интерфейс и опции за автоматизация като .NET компоненти."
DESCRIPTION_450_LETTERS4="WinSCP е популярен безплатен файлов мениджър за Windows, поддържащ SFTP, FTP, FTPS, SCP, S3, WebDAV и локални трансфери. Мощен инструмент за повишаване на производителността с удобен интерфейс и опции за автоматизация като .NET компоненти или командни скриптове (batch). Използвайте WinSCP също за редактиране на файлове, синхронизация на директории и управление на сайтове. WinSCP е с отворен код и добре документиран. Наличен е на английски и много други езици."
DESCRIPTION_2000_LETTERS4="WinSCP е популярен безплатен SFTP и FTP клиент за Windows. Освен това WinSCP е мощен универсален файлов мениджър, който ще подобри вашата производителност. WinSCP може да копира файлове между локален и отдалечен компютър, използвайки множество протоколи: Amazon S3, FTP, FTPS, SCP, SFTP или WebDAV. WinSCP може да копира файлове и между две локални папки. От една страна, WinSCP предлага лесен за използване графичен потребителски интерфейс; можете да избирате между изглед като Windows Explorer и интерфейс с раздели и два панела в стил Norton Commander. От друга страна, напредналите потребители могат да автоматизират функционалността на WinSCP чрез .NET компоненти или обикновени командни скриптове (batch). Ще използвате WinSCP за всички обичайни операции с файлове. Можете да започнете да редактирате даден файл директно от WinSCP, като използвате неговия вграден текстов редактор или чрез интеграция с любимия ви външен текстов редактор. Операциите на WinSCP не се ограничават до отделни файлове; WinSCP предлага също и няколко начина за синхронизиране на директории. След свързване към сайт можете да изберете да запазите информацията за него за последващ достъп, като WinSCP дори може да споделя настройките за сайтове с друг популярен инструмент с отворен код – PuTTY. WinSCP се интегрира също с PuTTY Pageant и OpenSSH агент за пълна поддръжка на удостоверяване с публичен ключ чрез SSH. Администраторите обожават поддръжката на WinSCP за преносима (portable) работа, използваща конфигурационен файл вместо записи в системния регистър (registry entries), което е подходящо за стартиране от сменяеми носители. Изчерпателна документация за WinSCP е свободно достъпна на адрес https://winscp.net. Този сайт хоства също и много активен потребителски форум за поддръжка и заявки за нови функции. WinSCP е наличен на английски и много други езици. WinSCP е софтуер с отворен код, който се разпространява безплатно съгласно условията на Общия публичен лиценз на GNU (GPL)."
