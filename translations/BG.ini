EDITOR_EARLY_CLOSED2="Стартираният редактор (приложение) за отваряне на файла „%s“ се затвори твърде рано. Ако не е бил затворен от вас, това може да се е случило, защото външният ви редактор отваря множество файлове в един прозорец (процес). В този случай допълнително стартираните инстанции на редактора просто изпращат новия файл към съществуващата инстанция и се затварят незабавно. За да поддържа такъв тип редактори, WinSCP трябва да адаптира поведението си – да не премахва временния файл при приключване на процеса, а да го пази, докато WinSCP работи. Това поведение може да бъде включено чрез премахване на отметката от опцията в настройките на редактора „Външният редактор отваря всеки файл в отделен прозорец (процес)“. Ако вашият редактор не е от този тип, пренебрегнете това съобщение и оставете файла да бъде премахнат от временната папка сега.\n \nИскате ли да премахнете отворения файл сега? (Натискайки „Не“, ще активирате специалното поведение и ще запазите файла във временната папка.)"
SAVE_SYNCHRONIZE_MODE2="**Искате ли да направите избраната от вас посока стандартна?**\n\nВие променихте предварително избраната посока на синхронизация. По подразбиране посоката се определя от панела с файлове, който е бил активен преди стартирането на функцията за синхронизиране."
