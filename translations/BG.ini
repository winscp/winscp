CLEANTEMP_CONFIRM2="**Искате ли да изтриете старите временни папки?**\n\nWinSCP откри %d временни папки, които вероятно са били създадени в миналото. Тези папки може да съдържат предишно редактирани или изтеглени файлове.\n\nМожете също така да отворите папките, за да прегледате съдържанието им и да ги изтриете сами."
