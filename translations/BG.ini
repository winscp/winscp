HELP_SEND_MESSAGE2="**Искате ли да изпратите съобщението до сайта на WinSCP?**\n\nНяма помощна страница, свързана с това съобщение. WinSCP може да потърси текста на съобщението в своя сайт с документация вместо вас.\n\nЗабележка: WinSCP ще изпрати съобщението в оригинален вид по несигурна интернет връзка. Моля, проверете дали съобщението не съдържа данни, които искате да защитите – като имена на файлове, акаунти или хостове."
