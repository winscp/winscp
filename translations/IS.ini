DESCRIPTION_80_LETTERS3="WinSCP er ókeypis skráastjóri fyrir Windows sem styður FTP, SFTP, S3 og WebDAV."
DESCRIPTION_250_LETTERS4="WinSCP er vinsæll ókeypis skráastjóri fyrir Windows. Hann styður SFTP, FTP, FTPS, SCP, S3, WebDAV og flutning milli staðbundinna skráasafna. Hann auðveldar skráavinnu með einföldu viðmóti og sjálfvirknivalmöguleikum á borð við .NET-samstæðu."
DESCRIPTION_450_LETTERS4="WinSCP er vinsæll ókeypis skráastjóri fyrir Windows. Hann styður SFTP, FTP, FTPS, SCP, S3, WebDAV og flutning milli staðbundinna skráasafna. Hann auðveldar skráavinnu með einföldu viðmóti og sjálfvirknivalmöguleikum á borð við .NET-samstæðu eða bunkaskriftur. Einnig má nota WinSCP til að breyta skrám, samstilla skráasöfn og sjá um setur. WinSCP er opinn hugbúnaður með ítarlegri handbók. Hann er fáanlegur á ensku og mörgum öðrum tungumálum."
DESCRIPTION_2000_LETTERS4="WinSCP er vinsæll ókeypis SFTP- og FTP-biðlari fyrir Windows. WinSCP er einnig öflugur almennur skráastjóri sem auðveldar skráavinnu. WinSCP getur afritað skrár milli staðbundinnar tölvu og fjarrænnar tölvu með ýmsum samskiptareglum: Amazon S3, FTP, FTPS, SCP, SFTP eða WebDAV. WinSCP getur einnig afritað skrár milli tveggja staðbundinna mappa. Í myndræna viðmótinu má velja milli útlits að hætti Windows File Explorer og tveggja spjalda með flipum að hætti Norton Commander. Vana notendur geta sjálfvirknivætt aðgerðir WinSCP með .NET-samstæðu eða einföldum bunkaskriftum. WinSCP nýtist í öllum algengum skráaaðgerðum. Þú getur byrjað að breyta skrá beint úr WinSCP, annaðhvort í innbyggða textaritlinum eða í ytri ritli að eigin vali. WinSCP býður einnig upp á nokkrar leiðir til að samstilla skráasöfn. Eftir tengingu við setur getur þú vistað upplýsingar um það til að tengjast aftur. WinSCP getur jafnvel deilt setursstillingum með PuTTY, öðru vinsælu opnu verkfæri. WinSCP tengist einnig PuTTY Pageant og auðkenningarfulltrúa OpenSSH til að styðja auðkenningu með dreifilykli í SSH. Kerfisstjórar kunna að meta að hægt sé að keyra WinSCP beint af færanlegum miðli með stillingaskrá í stað færslna í Windows Registry. Ítarleg handbók WinSCP er öllum aðgengileg á https://winscp.net/. Þar er einnig virkt notendaspjall fyrir stuðning og óskir um nýja eiginleika. WinSCP er fáanlegt á <íslensku>, ensku og mörgum öðrum tungumálum. WinSCP er opinn hugbúnaður sem er dreift án endurgjalds samkvæmt skilmálum GNU General Public License (GPL)."
